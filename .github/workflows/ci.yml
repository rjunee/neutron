name: ci

# Public Neutron Open CI (test-port tranche 1, 2026-06-15; PARALLELISED 2026-07-28).
# Runs on every PR + push to main.
#
# SHAPE. This was ONE job with seven sequential steps, so a ~2-minute typecheck
# error was reported only after a ~12-minute test run finished, and the local
# machine became the fast-feedback path by default. The gates are now INDEPENDENT
# JOBS that run concurrently, and the suite is SHARDED across runners. Each gate
# reinstalls deps — that is deliberate: a shared-artifact handoff would couple the
# gates back together and reintroduce the serialisation this change removes. A
# CACHE is not a handoff: a cache MISS still installs and still passes, so every
# job below stays independently runnable on its own.
#
# THE INSTALL IS NOT CHEAP, and this comment used to claim it was — a sentence
# written when the install was assumed to be local work. It is not. `bun.lock`
# takes `gbrain` as a GIT dependency (`github:garrytan/gbrain#<sha>`), so a cold
# `bun install --frozen-lockfile` fetches a tarball from api.github.com, and the
# split above means that now happens TWELVE times per PR — 8 shards plus
# typecheck, lint, purity and layering. That made a third party's availability a
# gate on this repo's PRs: on 2026-08-17 that URL answered 504 and redded SIX
# jobs at once on a PR whose only real defect was a single type error, costing a
# full review round to work out that the code was never the problem.
#
# So each job restores bun's global install cache, keyed on `bun.lock` and on the
# pinned bun version. The lockfile is what determines the content; the bun version
# is in the key because a bun upgrade may change the cache's on-disk layout, and
# restoring an older layout under a newer bun is a miss you pay for twice.
# `BUN_INSTALL_CACHE_DIR` is set explicitly at each install rather than leaning on
# bun's default location, so the directory actions/cache saves and the directory
# bun writes are the same string.
#
# WHAT IS CACHED IS BUN'S GLOBAL DOWNLOAD CACHE, NOT `node_modules`, and that is a
# choice rather than an oversight. The download cache is what removes the network
# fetch — the thing this change exists to remove — and it stays correct across
# lockfile changes because a `restore-keys` hit is a strict superset that
# `--frozen-lockfile` then filters down to exactly what `bun.lock` names. Caching
# `node_modules` instead would go further (the install would be closer to a no-op,
# ~9.5s of link work saved) but it caches a RESOLVED tree, so a partial-key hit
# would restore a tree the lockfile no longer describes and the correctness of the
# install would depend on bun noticing. The install is not a no-op here and is not
# claimed to be: it still runs, still resolves against the lockfile, and still
# links — it just does so without asking a third party for anything.
#
# NOTHING IN YAML MAKES THAT IDENTITY TRUE — it is ten separate literals across
# five jobs with no link between them, and a cache that silently misses every run
# is indistinguishable from no cache while looking fixed. So it is ASSERTED, not
# asserted-by-construction: `scripts/ci/ci-workflow.test.ts` ('bun install cache
# wiring') walks every job in this file, and for each one that installs, checks
# that the CHECKOUT precedes the cache step, that the cache step precedes the
# install, that its `path` is the SAME STRING as that install's
# `BUN_INSTALL_CACHE_DIR`, that the key carries the lockfile hash and this job's
# own `bun-version`, that `restore-keys` is exactly the key MINUS the lockfile
# hash, and that the action is pinned to a 40-hex sha. Change one of the ten
# literals without the other nine and that test fails.
#
# CHECKOUT-BEFORE-CACHE IS LOAD-BEARING and is the reason that check is named
# first. `hashFiles('bun.lock')` is evaluated against the workspace, so before a
# checkout it reads an empty tree and returns the EMPTY STRING. Hoist the cache
# step above the checkout and the key silently collapses to the `restore-keys`
# prefix — one entry, permanently frozen at whatever the first run stored,
# restored on every subsequent run no matter what `bun.lock` says. Nothing errors.
# That is why the guard is executable rather than prose: each of those mutations
# is applied to this file's own text in the test and must red the suite.
#
# THIS BUYS RELIABILITY, NOT WALL-CLOCK, and the numbers should say so rather than
# flatter the change. Measured across all 12 legs, PR #410's cold run vs its warm
# one: `bun install` itself drops from a ~13s median to ~9.5s, but restoring a
# 237 MB cache costs 5-10s that a cold run does not pay, so the median leg goes
# from ~14s to ~17.5s. On a GitHub-hosted runner the network is fast enough that
# downloading the packages beats restoring them. That is a ~3.5s regression per
# leg, paid in parallel, and it is worth it: the comparison that matters is not
# 14s vs 17.5s, it is 17.5s vs a job that FAILS, which is what a cold install got
# on 2026-08-17. Locally, where the network is ordinary, the same install is 118s
# cold and 36s warm — so the cold path is only cheap while a third party is
# healthy and close.
#
# RE-MEASURED ON #417 against THIS key, because the numbers above were first
# quoted from runs on the key that preceded it and a measurement is only as good
# as the thing it was measured against. All 12 legs reported
# `Cache restored from key: bun-install-Linux-bun1.3.9-<hash>` — an EXACT-key hit,
# not a prefix one, which is the direct evidence that the cache hits rather than
# silently missing. Warm restore ran 4-8s (median 6s) and `bun install` 8-13s
# (median 9s), so ~15s of restore+install per leg. That reproduces the trade this
# comment describes rather than merely repeating it.
#
# The property being bought is provable directly: locally, a warm cache installs
# all 2501 packages in 22s with ALL outbound HTTP blackholed, while the same
# blackhole against an empty cache installed nothing at all in ten minutes. A warm
# cache needs no network whatsoever. That is the whole point of the change.
#
# `restore-keys` gives the lockfile-changed case a partial hit: every package the
# change did NOT touch still comes from the cache, so a one-line dependency bump
# costs one download rather than 2500. It is safe for the same reason the cache
# itself is safe — a stale entry that `bun.lock` no longer names is simply never
# asked for.
#
# Its COST is that the entry only grows. actions/cache saves whenever the exact
# key missed, so a prefix hit restores the old superset and then saves that
# superset plus whatever the new lockfile added; nothing prunes what a dependency
# left behind.
#
# AND THE 10 GB CEILING IS NOT A FUTURE PROBLEM — IT IS ALREADY EXCEEDED. Measured
# 2026-08-18 (`gh api repos/<owner>/<repo>/actions/cache/usage`): 11.22 GB across
# 47 entries against a 10 GB ceiling, so GitHub's LRU eviction is running RIGHT
# NOW, not eventually. The earlier version of this comment called it "a slow leak,
# not a steady state" and said the ceiling was far enough out to ignore; that was
# an estimate written without the measurement and it was wrong on merge day. What
# the measurement also shows is that the bun entries are not the cause: 9.76 GB of
# it is 43 `codeql-overlay` entries written by GitHub's default CodeQL setup, and
# all `bun-install` entries together are 0.66 GB (3 entries at ~237 MB). The bun
# entries survive because LRU evicts the least recently USED and they are read by
# twelve legs on every run — but they are subject to that pressure from today, so
# a cold install after an eviction is a normal event to expect rather than a
# symptom of broken wiring. Reclaiming the space is a CodeQL-retention question,
# not a bun one, and it is deliberately not fixed here. The fix for growth on the
# bun side remains bumping a salt in the key rather than dropping `restore-keys`.
#
# WHERE THE BENEFIT ACTUALLY LANDS, because the scoping is not obvious and it is
# the difference between this working and merely looking like it works. Actions
# caches are readable from the branch that wrote them and from the DEFAULT branch,
# and nowhere else. A cache written by a SAME-REPOSITORY PR run is therefore
# scoped to that PR: it warms that PR's later pushes and no one else's. The
# cross-PR win starts when a `push` run on `main` writes the main-scoped entry,
# which every PR can then read. So expect the first run of a same-repo PR after a
# `bun.lock` change to be cold, and everything else to be warm — not "every run is
# warm from day one".
#
# A FORK PR IS THE EXCEPTION and the earlier version of this paragraph did not say
# so. `pull_request` runs from a fork get a READ-ONLY `GITHUB_TOKEN`, so a fork leg
# can RESTORE the main-scoped entry but cannot SAVE one. For a fork PR the
# "one cold leg pays, eleven warm legs benefit" arithmetic does not apply: if
# main's entry is present every leg is warm and nothing is written, and if it is
# absent every leg is cold and stays cold for that PR's whole life. Restores are
# still the common case because `main` writes the entry on every push, but a fork
# PR opened while main's entry is evicted gets no warming at all from itself.
#
# EXPECTED NOISE, so nobody re-debugs it: on a cold run all twelve legs miss and
# all twelve try to save the same key, so exactly ONE wins and the other eleven
# log `Failed to save: Unable to reserve cache with key ..., another job may be
# creating this cache`. That is benign and non-fatal — the cache exists after the
# first winner, and those jobs pass. It is alarming to read and means nothing.
#
# A CACHE MUST NEVER MAKE A BUILD WRONG — and this is the claim to state
# NARROWLY, because the obvious version of it is not true. What
# `--frozen-lockfile` guarantees is RESOLUTION: bun refuses to re-resolve or
# rewrite `bun.lock`, so the exact set of package identities — every name@version,
# and the git dep's exact commit — is decided by the committed lockfile and cannot
# be changed by anything sitting in the cache. A cache entry naming a package the
# lockfile does not name is simply never asked for; a `package.json` that has
# drifted from the lockfile fails the install outright.
#
# What it does NOT do is re-verify the BYTES of a restored entry. For registry
# packages the lockfile carries an integrity hash (`bun.lock` line for `zod`:
# `sha512-…`), but the `gbrain` git dependency carries none — its lockfile tuple
# ends in the cache folder name `garrytan-gbrain-<sha>`, not a content hash — and
# bun does not document per-restore content verification either way. So "the
# cache can only change how long an install takes" is the intent, not a property
# `--frozen-lockfile` proves.
#
# What actually bounds the residual risk is SCOPE, not verification: an Actions
# cache entry is writable only from runs on this repo's own branches, so poisoning
# one already requires the ability to run workflow code here — the same privilege
# as pushing to the repo. Vendoring `gbrain` is what would close it properly, by
# putting the content in the tree under review instead of behind a fetch.
#
# THE `test` JOB IS LOAD-BEARING AND MUST KEEP THAT EXACT NAME. `test` and
# `CodeQL` are REQUIRED status checks on `main` with a strict up-to-date policy.
# A required context that never reports blocks every PR forever, so the shards
# are named `shard` and `test` is an AGGREGATOR that needs them all. Renaming
# `test`, or making it anything other than a job that fails when any gate fails,
# bricks merging on this repo.
#
# WHY THE AGGREGATOR IS NOT COSMETIC. A sharded run cannot prove on its own that
# every test file executed — it proves it ran its own slice. The whole-suite
# guarantee is: identical deterministic discovery on every shard + a partition
# with no gaps or overlap (scripts/__tests__/run-tests-shard.test.ts) + EVERY
# SHARD REQUIRED TO REPORT. The aggregator is that third leg. `if: always()` plus
# an explicit result check is required — without `always()` the job would be
# SKIPPED when a shard fails, and a skipped required check does not fail a PR.

# `pull_request` (no `branches`/`types` filter) fires the `test` job for EVERY
# PR — opened, synchronize, reopened — to any base, so a PR to main can never
# merge without a `test` signal regardless of head-branch name shape (#321).
#
# `merge_group` is REQUIRED for the merge queue, and its absence is why a queue
# could not be enabled before: GitHub runs required checks against the queue's
# speculative merge branch, and a workflow that does not listen for the event
# never reports — so every queued PR would sit forever waiting for a `test` that
# never ran.
#
# WHY A QUEUE AT ALL (owner-requested 2026-08-11: "It is absolutely a fundamental
# requirement that we can run many many builds in parallel on the same repo, in
# worktrees, and we cant have wasted inefficient multiple review cycles").
# `main` requires branches to be up to date before merging, so without a queue
# every merge invalidates every other open PR: N parallel builds cost O(N^2) CI
# runs as each one updates and re-runs. The queue tests each PR once against the
# projected main instead.
#
# And the part that matters for trident specifically: the queue tests a TEMPORARY
# branch and never touches the PR's own head. A trident verdict is bound to the
# head it reviewed, so queueing does not invalidate a review the way an
# author-side update does. That is the "no wasted review cycles" half.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Least-privilege default token: this workflow only reads the checkout, runs
# typecheck + tests, and grants no write scopes (fixes the CodeQL alert
# actions/missing-workflow-permissions).
permissions:
  contents: read

# Cancel superseded runs to save runner minutes. Key PR runs on the PR NUMBER
# (always slash-free) and push runs on the ref, namespaced by workflow. The
# previous `ci-${{ github.ref }}` group keyed PR runs on a ref that, for some
# branch-name shapes (e.g. a slashed `feat/...` head), could let the `test` job
# be superseded/skipped so a PR merged with only CodeQL signal (#321). The
# `github.event.pull_request.number || github.ref` form is GitHub's documented
# pattern and guarantees every PR to main gets its own independent `test` run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---- fast gates: independent, report in ~1-3 min instead of behind the suite --
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      # Bun's install cache — keeps the `gbrain` git fetch off api.github.com (header).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-install-${{ runner.os }}-bun1.3.9-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-bun1.3.9-
      # Install BEFORE tsc so the @neutronai/* workspace symlinks exist; a bare
      # checkout reports phantom TS2307s.
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      # G5 — typecheck completeness: `tsc -p` for EVERY tsconfig.json in the repo,
      # not just the root config. Discovery is dynamic, so a new package with a
      # tsconfig is covered automatically; ci-workflow.test.ts guards that.
      - run: bash scripts/ci/typecheck-all.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      # Bun's install cache — keeps the `gbrain` git fetch off api.github.com (header).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-install-${{ runner.os }}-bun1.3.9-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-bun1.3.9-
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      # L5 — relative cross-workspace import guard (eslint import/no-relative-packages
      # + a companion type-query check for the `import('...').Foo` form ESLint can't lint).
      - run: bash scripts/ci/lint.sh

  purity:
    name: purity
    runs-on: ubuntu-latest
    steps:
      # The leak gate also scans this branch's COMMIT MESSAGES (they are mirrored
      # to GHArchive permanently and cannot be redacted afterwards), which needs
      # real history — a depth-1 checkout has neither the PR base sha nor
      # origin/main, and the gate hard-fails rather than skipping that half.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      # Bun's install cache — keeps the `gbrain` git fetch off api.github.com (header).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-install-${{ runner.os }}-bun1.3.9-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-bun1.3.9-
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      # Fails the build if multi-instance vocabulary, owner PII or a Managed
      # module ever regresses into this public tree.
      - name: leak gate
        env:
          # BOTH halves are required and neither works alone. The Tier-1 PII rule
          # had NEVER executed (~3,700 runs) because the secret did not exist AND
          # nothing passed the variable — and the gate still printed SILENT. It is
          # now fail-closed: an absent denylist on a run that HAS secret access is
          # exit 2, so a broken wire is loud instead of invisible.
          LEAK_GATE_PII_DENYLIST_B64: ${{ secrets.LEAK_GATE_PII_DENYLIST_B64 }}
          # Fork detection — GITHUB_REPOSITORY is always the BASE repo, so an
          # inequality here means the head is a fork and GitHub is withholding
          # secrets by design. That is the ONLY context allowed to skip Tier-1;
          # leak-gate-nightly.yml re-scans the merged tree with the secret.
          LEAK_GATE_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # Commit-message scan window: the PR base, or the pre-push sha.
          LEAK_GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # PR title/body are attacker-controlled text. Passing them through `env:`
          # is safe; interpolating `${{ github.event… }}` into `run:` would be a
          # shell-injection sink.
          LEAK_GATE_PR_TITLE: ${{ github.event.pull_request.title }}
          LEAK_GATE_PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/ci/leak-gate.sh --tree .

  layering:
    name: layering
    runs-on: ubuntu-latest
    steps:
      # G8's ratchet-growth guard diffs the committed baseline against main's, so
      # it needs main's history — a depth-1 checkout has no origin/main to compare.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      # Bun's install cache — keeps the `gbrain` git fetch off api.github.com (header).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-install-${{ runner.os }}-bun1.3.9-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-bun1.3.9-
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      # G4 — dependency-cruiser layering ratchet (fails on any NEW cross-band
      # import or cycle; the grandfathered baseline may only shrink).
      - run: bash scripts/ci/depcruise.sh
      # G8 — a PR could otherwise grandfather a new cross-band edge just by adding
      # it to the baseline and stay green.
      - run: bash scripts/ci/depcruise-ratchet-guard.sh
      # G9 — composition wiring. A declared `enable_*` switch that no production
      # composer sets is a feature that cannot run, and this repo has shipped six
      # of those with green CI. Every existing wiring test hand-builds the config
      # literal the composer SHOULD have produced, so the gate was never the
      # failing step; this checks the step that was.
      - run: bash scripts/ci/composition-wiring-gate.sh .
      # Route-slot coverage ratchet. `open/__tests__/route-slot-coverage.test.ts`
      # boots the real composition and asserts every served surface is still
      # served — but it reads its own baseline, so it cannot see a rung being
      # MOVED into the unserved allowlist, which deletes the assertion and lets
      # the route 404 with CI green. This is that half. Lives here because the
      # layering job is the one checked out with full history.
      - run: bash scripts/ci/route-slot-ratchet-guard.sh
      # Composition-field coverage ratchet — the same shape of guard for the
      # fields that are neither an `enable_*` boolean nor an HTTP route slot, and
      # which consequently NEITHER gate above can see. `push_dispatcher` was one:
      # declared, consumed, set by no composer, so push registered devices and
      # delivered to none of them.
      # `open/__tests__/composition-field-coverage.test.ts` boots the real
      # composition and asserts every wired field is still set; this half stops a
      # field being MOVED into the unwired allowlist, which deletes the assertion
      # and takes the capability dark with CI green.
      - run: bash scripts/ci/composition-field-ratchet-guard.sh
      # The append-only build log must resolve to `merge=union` in a FRESH clone,
      # which is what makes two concurrent PRs stop conflicting on it by
      # construction. This gate shipped with no workflow step at all — it ran
      # nowhere, so the property it names was unguarded in exactly the way the
      # guards above exist to stop. It asks `git check-attr` over the tracked
      # .gitattributes alone, so a clone carrying the opt-in entry-aware driver
      # cannot mask a deleted floor.
      - run: bun scripts/ci/check-governed-repo-attributes.ts .

  # ---- the suite, sharded across runners ---------------------------------------
  shard:
    name: shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — one shard failing must not cancel the others. Cancelling
      # would hide every OTHER failing file behind whichever shard tripped first,
      # turning a "12 tests broken" signal into "1 test broken" and costing a
      # round-trip per remaining failure.
      fail-fast: false
      matrix:
        # EIGHT legs, not four. A PR waits on the SLOWEST shard, so the only thing
        # that shortens the wait is less work on that one runner — and these are
        # GitHub-hosted runners, so the extra legs cost CI minutes and nothing on
        # any developer machine. Measured against the cost model in run-tests.sh
        # §2c over the 1296 general-lane files on this tree: the slowest shard's
        # estimated test time falls from 70.4s at four legs to 35.2s at eight.
        #
        # Eight rather than twelve because each leg pays a fixed toll — checkout,
        # `bun install`, and the ~15s full discovery + bun cross-check that EVERY
        # shard runs (deliberately: that is what keeps a coverage drift visible on
        # every runner). Past eight, that toll starts to dominate the shrinking
        # test slice, and each additional leg is one more chance for a transient
        # failure to red a PR that has nothing wrong with it.
        #
        # If you change this list you MUST change the /N in NEUTRON_TEST_SHARD
        # below to match. That pairing is asserted by
        # scripts/ci/ci-workflow.test.ts ('the shard matrix size MATCHES the /N'),
        # because widening the matrix while leaving the denominator behind makes
        # the extra shards run NOTHING while reporting green — a silent coverage
        # hole that looks exactly like a faster suite.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      # Bun's install cache — keeps the `gbrain` git fetch off api.github.com (header).
      # This is the leg that multiplies: eight shards, eight identical installs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-install-${{ runner.os }}-bun1.3.9-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-bun1.3.9-
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - name: Test (shard ${{ matrix.shard }} of 8)
        env:
          NEUTRON_TEST_SHARD: ${{ matrix.shard }}/8
          # Each shard carries ~1/8 of the files on its own 7 GB runner, so the OOM
          # pressure that forced concurrency 4→2 and chunk 100→75 (#193) is divided
          # further still. The documented defaults stay; peak RSS per runner is well
          # below where it tipped, because the file COUNT per runner is now an
          # eighth of what it was when it tipped.
          NEUTRON_TEST_CONCURRENCY: "4"
          NEUTRON_TEST_CHUNK_SIZE: "100"
        run: bash scripts/run-tests.sh

  # ---- required context: keep this job named `test` (see header) ----------------
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [typecheck, lint, purity, layering, shard]
    # always() so this job still RUNS when a dependency fails. Without it the job
    # is skipped, and a skipped required check does not block a PR — the exact
    # fail-open shape this aggregator exists to prevent.
    if: always()
    steps:
      - name: Assert every gate and every shard succeeded
        run: |
          echo "typecheck : ${{ needs.typecheck.result }}"
          echo "lint      : ${{ needs.lint.result }}"
          echo "purity    : ${{ needs.purity.result }}"
          echo "layering  : ${{ needs.layering.result }}"
          echo "shards    : ${{ needs.shard.result }}"
          # A matrix job's aggregate result is 'success' only when EVERY leg
          # succeeded, so this covers every shard leg. 'skipped' is treated as a
          # failure on purpose: a shard that never ran means files that never ran,
          # which is a coverage hole, not a pass.
          for r in "${{ needs.typecheck.result }}" "${{ needs.lint.result }}" \
                   "${{ needs.purity.result }}" "${{ needs.layering.result }}" \
                   "${{ needs.shard.result }}"; do
            if [ "$r" != "success" ]; then
              echo "FAIL — a required gate did not succeed (see above)."
              exit 1
            fi
          done
          echo "All gates green across every shard leg."
